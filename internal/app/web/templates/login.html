<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>登录 · 小苹果邮箱</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg?v=1.1.0">
  <link rel="stylesheet" href="/assets/ui.css?v=1.2.2">
  <script type="module" src="/assets/login.js?v=1.0.3"></script>
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-labelledby="brand-title">
      <div class="brand-icon" aria-hidden="true">
        <img src="/assets/logo.svg?v=1.1.0" alt="">
      </div>
      <p class="eyebrow">小苹果邮箱 · SELF-HOSTED PRIVACY MAIL</p>
      <h1 id="brand-title">让隐私邮箱保持<br>清晰、可靠、可控。</h1>
      <p>连接 iCloud 管理隐私邮箱，接收邮件并提取验证码与登录链接。</p>
      <ul class="feature-list" aria-label="核心能力">
        <li><span>01</span>邮箱管理与收件独立连接</li>
        <li><span>02</span>IMAP 实时取码与最小化留存</li>
        <li><span>03</span>具名 API Key 与临时租约</li>
      </ul>
    </section>
    <section class="login-card" aria-labelledby="login-title">
      <div class="mobile-brand"><img src="/assets/logo.svg?v=1.1.0" alt="">小苹果邮箱</div>
      <p class="eyebrow">ADMIN CONSOLE</p>
      <h2 id="login-title">欢迎回来</h2>
      <p class="muted">使用管理员账号进入控制台。</p>
      <div id="login-error" class="inline-alert danger" hidden role="alert" tabindex="-1"></div>
      <form id="login-form" novalidate>
        <label class="field">
          <span>管理员账号</span>
          <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="64" placeholder="admin">
          <small class="field-error" data-error-for="username"></small>
        </label>
        <label class="field">
          <span>密码</span>
          <span class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="32" placeholder="请输入密码">
            <button type="button" class="icon-button password-toggle" data-action="toggle-password" aria-label="显示密码">
              <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            </button>
          </span>
          <small id="caps-lock" class="field-hint" hidden>大写锁定已开启</small>
          <small class="field-error" data-error-for="password"></small>
        </label>
        <button id="login-submit" class="button primary wide" type="submit">
          <span data-button-label>进入控制台</span><span class="spinner" hidden aria-hidden="true"></span>
        </button>
      </form>
      <p class="security-note"><svg viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.5c0 5.2-3.4 8.5-8 10-4.6-1.5-8-4.8-8-10V6l8-3.5Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>仅通过受信任的 HTTPS 地址访问本控制台。</p>
    </section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
