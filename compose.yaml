services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:18787:8787"
    volumes:
      - ./data:/app/data
    command:
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --database
      - /app/data/small-apple-mail.db
